annotation_columns: null
img_path_col: filepath
requires_paired: true
data_case: IMG<->IMG
k_filter: null
scaling: NONE
skip_preprocessing: false
class_param: null

latent_dim: 64
hidden_dim: 24
n_layers: 3
enc_factor: 4

maskix_hidden_dim: 256
maskix_swap_prob: 0.4
drop_p: 0.1
save_memory: false
save_vram: true

learning_rate: 0.0004628223166023
compile_model: false
pin_memory: false
batch_size: 35
epochs: 250
weight_decay: 5.136186358487116e-06

reconstruction_loss: mse
default_vae_loss: kl
loss_reduction: mean
beta: 3.832427557775615e-05
beta_mi: 1
beta_tc: 1
beta_dimKL: 1
use_mss: true

gamma: 10.0
delta_pair: 5.0
delta_class: 5.0
delta_mask_predictor: 0.7
delta_mask_corrupted: 0.75
maskix_architecture: scMAE

min_samples_per_split: 1
anneal_function: logistic-late
pretrain_epochs: 0
grad_clip_max_norm: 5

device: auto
n_gpus: 1
checkpoint_interval: 10
float_precision: '32'
gpu_strategy: auto

train_ratio: 0.7
test_ratio: 0.2
valid_ratio: 0.1

reproducible: false
global_seed: 1
profiling: false
profile_logs: profile

n_conv_layers_3d: 5
spatial_shape_policy: crop_or_pad_to_shape
target_multiple: 32
target_shape_3d:
  - 160
  - 192
  - 160
padding_mode_3d: 0
normalize_nonzero_only: true
volume_scaling_strategy: per_volume
clamp_logvar: true
logvar_range:
  - -10
  - 20
keep_mu_positive: false
train_normalization: batch
train_norm_groupsize: 8
