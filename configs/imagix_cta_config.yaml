annotation_columns: null
img_path_col: filepath
requires_paired: true
data_case: IMG<->IMG
k_filter: null
scaling: NONE
skip_preprocessing: false
class_param: null

latent_dim: 64
hidden_dim: 24
n_layers: 3
enc_factor: 4

maskix_hidden_dim: 256
maskix_swap_prob: 0.4
drop_p: 0.1
save_memory: false
save_vram: false

learning_rate: 0.0134606700865418
compile_model: false
pin_memory: false
batch_size: 35
epochs: 250
weight_decay: 2.9591060828769537e-07

reconstruction_loss: mse
default_vae_loss: kl
loss_reduction: mean
beta: 1.1963401747530954e-05
beta_mi: 1
beta_tc: 1
beta_dimKL: 1
use_mss: true

gamma: 10.0
delta_pair: 5.0
delta_class: 5.0
delta_mask_predictor: 0.7
delta_mask_corrupted: 0.75
maskix_architecture: scMAE

min_samples_per_split: 1
anneal_function: logistic-late
pretrain_epochs: 0
grad_clip_max_norm: 5

device: auto
n_gpus: 1
checkpoint_interval: 10
float_precision: '32'
gpu_strategy: auto

train_ratio: 0.7
test_ratio: 0.2
valid_ratio: 0.1

reproducible: false
global_seed: 1
profiling: false
profile_logs: profile
